; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = feather32u4
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/build_version.py
build_flags = -flto
lib_deps = 
	adafruit/Adafruit SleepyDog Library@^1.6.5
	mikem/RadioHead@^1.120
	sukkopera/PsxNewLib@^0.4.0
	embeddedartistry/LibPrintf@^1.2.13
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
	adafruit/Adafruit PWM Servo Driver Library@^3.0.2
	adafruit/Adafruit ADS1X15@^2.5.0
	robtillaart/AS5600@^0.6.7

[env:transmitter]
build_flags = ${env.build_flags} -DTRANSMITTER
upload_port = COM3
monitor_port = COM3

[env:receiver]
build_flags = ${env.build_flags} -DRECEIVER
upload_port = COM10
monitor_port = COM10
